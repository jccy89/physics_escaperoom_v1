<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rate Your Experience</title><style>body{margin:0;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),url("wallpaper2.jpg") center/cover no-repeat;color:#fff}.card{width:min(700px,92%);background:rgba(255,255,255,.12);backdrop-filter:blur(12px);padding:40px;border-radius:20px;text-align:center}.stars{font-size:60px}.star{cursor:pointer;color:#777}.active{color:gold}button{padding:12px 24px;border:none;border-radius:10px;background:#22c55e;font-size:18px;font-weight:bold;cursor:pointer;margin-top:20px}</style></head><body><div class="card"><h1>🎉 Mission Complete!</h1><h2>Please rate your experience</h2><div class="stars"><span class="star" data-v="1">&#9733;</span><span class="star" data-v="2">&#9733;</span><span class="star" data-v="3">&#9733;</span><span class="star" data-v="4">&#9733;</span><span class="star" data-v="5">&#9733;</span></div><p id="txt">Select a rating</p><button onclick="submitRating()">Submit Rating</button><p id="msg"></p></div><script>let r=0;const names=["Very Poor","Poor","Good","Very Good","Excellent"];document.querySelectorAll(".star").forEach((s,i)=>{s.onclick=()=>{r=i+1;document.querySelectorAll(".star").forEach((x,j)=>x.classList.toggle("active",j<=i));txt.innerHTML="Rating: <b>"+r+"/5</b> ("+names[i]+")";};});function submitRating(){if(!r){alert("Please select a rating.");return;}localStorage.setItem("rating",r);msg.innerHTML="Thank you! Redirecting...";setTimeout(()=>location.href="certificate.html",1200);}</script></body></html>
