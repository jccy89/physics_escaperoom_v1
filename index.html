<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Escape Room - Level 1</title>
<style>
body::before{
content:"";position:fixed;inset:0;
background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),url('wallpaper.jpg') center/cover no-repeat;
z-index:-1}
body{margin:0;font-family:Arial,sans-serif;color:#fff;display:flex;justify-content:center;padding:30px}
.container{width:min(900px,92%);background:rgba(255,255,255,.12);backdrop-filter:blur(10px);padding:25px;border-radius:18px;position:relative}
#score{position:absolute;top:18px;right:20px;font-weight:bold;color:gold}
#overall{margin-top:8px}
.bar{height:12px;background:#334155;border-radius:10px;overflow:hidden}
.fill{height:100%;background:#22c55e;width:25%}
#stageBar .fill{width:33%}
.badge{display:inline-block;padding:6px 12px;border-radius:20px;font-weight:bold}
.easy{background:#16a34a}.moderate{background:#eab308;color:#000}.challenge{background:#dc2626}
input{width:60%;padding:10px;border-radius:8px;border:none;font-size:16px}
button{padding:10px 20px;border:none;border-radius:8px;margin:8px;cursor:pointer;background:#22c55e;font-weight:bold}
button:hover{background:#16a34a}
#timer{font-size:20px;color:#facc15;margin:10px 0}
#train{position:absolute;bottom:-40px;left:-320px;width:260px}
#start{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10}
</style>
</head>
<body>
<div id="start">
<h1>🚆 Physics Escape Room</h1>
<p>Enter your name</p>
<input id="playerName">
<button onclick="startGame()">Start Game</button>
</div>

<div class="container">
<div id="score">Score: 0</div>

<h2>Level 1 of 4</h2>
<div class="bar"><div class="fill" id="overallFill"></div></div>

<h3 id="difficulty"></h3>
<div class="bar" id="stageBar"><div class="fill" id="stageFill"></div></div>

<div id="timer"></div>

<h2 id="questionTitle"></h2>
<p id="question"></p>

<input id="answer" placeholder="Enter your answer">
<br>
<button onclick="checkAnswer()">Submit</button>
<button onclick="showHint()">💡 Hint</button>

<p id="feedback"></p>

<img src="train.png" id="train">

<audio id="correctSound" src="correct.mp3"></audio>
<audio id="wrongSound" src="wrong.mp3"></audio>
<audio id="tickSound" src="tick.mp3"></audio>
<audio id="bgm" src="bgm.mp3" loop></audio>
<audio id="crashSound" src="crash.mp3"></audio>
</div>

<script>
const stages=[
{
difficulty:"Easy",
className:"easy",
title:"Stage 1",
question:`The ART accelerates uniformly from rest to 70 km/h in 20 s.<br><br>
Calculate the acceleration of the ART, giving your answer to 3 significant figures (m/s²).`,
answer:0.972,
tol:0.005,
hint:"a = (v-u)/t",
score:10
},
{
difficulty:"Moderate",
className:"moderate",
title:"Stage 2",
question:`An ART accelerates from rest to 15 m/s in the first 20 s, then travels at a constant speed of 15 m/s for 2 km, before increasing speed to 20 m/s for the remaining distance.<br><br>
Calculate the total journey time (s).`,
answer:303,
tol:1,
hint:"Use s = ut + ½at² and t = s/v",
score:20
},
{
difficulty:"Challenge",
className:"challenge",
title:"Stage 3",
question:`During a performance test, an ART accelerates uniformly from rest to 70 km/h. The acceleration period covers 250 m.<br><br>
Calculate the time taken to reach maximum speed (s).`,
answer:25.7,
tol:0.2,
hint:"Use v² = u² + 2as",
score:30
}
];

let current=0;
let player="";
let totalTime=180;
let timer;

if(!localStorage.score) localStorage.score=0;

function startGame(){
player=document.getElementById("playerName").value.trim();
if(player===""){alert("Please enter your name.");return;}
localStorage.setItem("playerName", player);
document.getElementById("start").style.display="none";
document.getElementById("bgm").play().catch(()=>{});
updateScore();
loadStage();
startTimer();
moveTrain();
}

function loadStage(){
let s=stages[current];
document.getElementById("difficulty").innerHTML=`<span class="badge ${s.className}">${s.difficulty}</span>`;
document.getElementById("questionTitle").textContent=s.title;
document.getElementById("question").innerHTML=s.question;
document.getElementById("answer").value="";
document.getElementById("feedback").textContent="";
document.getElementById("stageFill").style.width=((current+1)/3*100)+"%";
}

function checkAnswer(){
let val=parseFloat(document.getElementById("answer").value);
let s=stages[current];
if(Math.abs(val-s.answer)<=s.tol){
document.getElementById("correctSound").play();
localStorage.score=parseInt(localStorage.score)+s.score;
updateScore();
if(current<2){
document.getElementById("feedback").innerHTML="✅ Correct! Loading next stage...";
current++;
setTimeout(loadStage,1200);
}else{
clearInterval(timer);
document.getElementById("feedback").innerHTML=`<h2>🎉 Congratulations ${player}!</h2>
<p>You completed Level 1.</p>
<p>Preparing Level 2...</p>`;
setTimeout(()=>window.location.href="level2.html",2500);
}
}else{
document.getElementById("wrongSound").play();
document.getElementById("feedback").textContent="❌ Incorrect. Try again.";
}
}

function showHint(){alert(stages[current].hint);}

function updateScore(){
document.getElementById("score").textContent="Score: "+localStorage.score;
}

function startTimer(){
document.getElementById("timer").textContent="⏳ Time Left: "+totalTime+" s";
timer=setInterval(()=>{
totalTime--;
document.getElementById("timer").textContent="⏳ Time Left: "+totalTime+" s";
if(totalTime<=5 && totalTime>0) document.getElementById("tickSound").play().catch(()=>{});
if(totalTime<=0){
clearInterval(timer);
document.getElementById("crashSound").play().catch(()=>{});
alert("Time's up! The ART has failed the mission!");
location.reload();
}
},1000);
}

function moveTrain(){
let t=document.getElementById("train");
let p=-320;
(function anim(){
p+=3;
t.style.left=p+"px";
if(p<window.innerWidth) requestAnimationFrame(anim);
})();
}
</script>
</body>
</html>
