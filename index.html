<!DOCTYPE html><html><head><meta charset='UTF-8'>
<title>Level 1 - Kinematics</title>
<link rel='stylesheet' href='style.css'>
<style>:root{--bg:url('wallpaper.jpg')}#train{width:240px}</style></head>
<body>
<div class='container'>
<h1>Level 1 - Kinematics</h1>
<div>Overall Progress<div class='bar'><div class='fill' style='width:25%'></div></div></div>
<p id='score'></p><div id='diff'></div><div id='q'></div>
<input id='ans'><br><button onclick='check()'>Submit</button>
<button onclick='hint()'>Hint</button><p id='fb'></p>
<img id='train' src='train.png'>
</div>
<script>
const stages=[\n{diff:"Easy",cls:"easy",title:"Stage 1",q:"ART accelerates from rest to 70 km/h in 20 s. Calculate acceleration (m/s²).",a:0.972,t:0.005,h:"a=(v-u)/t",score:10},\n{diff:"Moderate",cls:"moderate",title:"Stage 2",q:"Journey time question. Answer in s.",a:303,t:1,h:"s=ut+½at² and t=s/v",score:20},\n{diff:"Challenge",cls:"challenge",title:"Stage 3",q:"Acceleration over 250 m. Find time (s).",a:25.7,t:0.2,h:"v²=u²+2as",score:30}\n];
let i=0;
if(!localStorage.score) localStorage.score=0;
function load(){
let s=stages[i];
document.getElementById('score').textContent='Score: '+localStorage.score;
document.getElementById('diff').innerHTML='<span class="badge '+s.cls+'">'+s.diff+'</span>';
document.getElementById('q').innerHTML='<h3>'+s.title+'</h3><p>'+s.q+'</p>';
document.getElementById('ans').value='';document.getElementById('fb').textContent='';
}
function check(){
let s=stages[i],v=parseFloat(document.getElementById('ans').value);
if(Math.abs(v-s.a)<=s.t){
localStorage.score=parseInt(localStorage.score)+s.score;
if(i<2){i++;load();}
else{alert('Level Complete!');location.href='level2.html';}
}else{document.getElementById('fb').textContent='Incorrect. Try again.';}
}
function hint(){alert(stages[i].h);}
load();
</script></body></html>
