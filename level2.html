<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Escape Room - Level 2 (Dynamics)</title>
<style>
body::before{
content:"";position:fixed;inset:0;
background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),url('wallpaper2.jpg') center/cover no-repeat;
z-index:-1}
body{margin:0;font-family:Arial,sans-serif;color:#fff;display:flex;justify-content:center;padding:30px}
.container{width:min(900px,92%);background:rgba(255,255,255,.12);backdrop-filter:blur(10px);padding:25px;border-radius:18px;position:relative}
#score{position:absolute;top:18px;right:20px;font-weight:bold;color:gold}
.bar{height:12px;background:#334155;border-radius:10px;overflow:hidden}
.fill{height:100%;background:#22c55e;width:50%}
#stageBar .fill{width:33%}
.badge{display:inline-block;padding:6px 12px;border-radius:20px;font-weight:bold}
.easy{background:#16a34a}.moderate{background:#eab308;color:#000}.challenge{background:#dc2626}
input{width:60%;padding:10px;border-radius:8px;border:none;font-size:16px}
button{padding:10px 20px;border:none;border-radius:8px;margin:8px;cursor:pointer;background:#22c55e;font-weight:bold}
button:hover{background:#16a34a}
#timer{font-size:20px;color:#facc15;margin:10px 0}
#train{position:absolute;bottom:-70px;left:-320px;width:500px;height:auto;}
#start{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10}
</style>
</head>
<body>

<div id="start">
<h1>⚙️ Physics Escape Room</h1>
<p id="welcome"></p>
<button onclick="startGame()">Start Mission</button>
</div>

<div class="container">
<div id="score">Score: 0</div>
<h2>Level 2 of 4 (Dynamics)</h2>
<div class="bar"><div class="fill"></div></div>

<h3 id="difficulty"></h3>
<div class="bar" id="stageBar"><div class="fill" id="stageFill"></div></div>

<div id="timer"></div>

<h2 id="questionTitle"></h2>
<p id="question"></p>

<input type="text" id="answer" placeholder="Enter your answer"><br>
<button onclick="checkAnswer()">Submit</button>
<button onclick="showHint()">💡 Hint</button>

<p id="feedback"></p>

<img src="train.png" id="train" alt="train">

<audio id="correctSound" src="correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="wrong.mp3" preload="auto"></audio>
<audio id="tickSound" src="tick.mp3" preload="auto"></audio>
<audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
<audio id="crashSound" src="crash.mp3" preload="auto"></audio>
</div>

<script>
const stages=[
{
difficulty:"Easy",className:"easy",title:"Stage 1",
question:`A fully loaded KUTS ART vehicle travels at <b>70 km/h</b> before emergency braking is activated. The vehicle stops completely in <b>25 s</b>.<br><br>
Given:<br>• Empty vehicle mass = 42,000 kg<br>• Passenger capacity = 300 persons<br>• Average passenger mass = 80 kg/person<br><br>
Calculate the average braking force required.<br><b>Answer in kN (3 s.f.).</b>`,
answer:51.3,tol:0.5,hint:"Find total mass, calculate acceleration, then use F = ma.",score:10},
{
difficulty:"Moderate",className:"moderate",title:"Stage 2",
question:`A fully loaded ART has a mass of <b>66,000 kg</b>.<br>Driving force = <b>50 kN</b><br>Rolling resistance = <b>8 kN</b><br><br>Calculate the acceleration (m/s²).`,
answer:0.636,tol:0.005,hint:"Fnet = Fdrive − Fresistance, then F = ma.",score:20},
{
difficulty:"Challenge",className:"challenge",title:"Stage 3",
question:`Mass = <b>66,000 kg</b><br>Traction = <b>70 kN</b><br>Drag = <b>6.5 kN</b><br>Rolling resistance = <b>4.0 kN</b><br><br>Calculate the acceleration (m/s²).`,
answer:0.902,tol:0.005,hint:"Fnet = Fdrive − Fdrag − Frolling",score:30}
];

let current=0;
let player="";
let totalTime=180;
let timerInterval;
let bgm=document.getElementById("bgm");

if(!localStorage.score) localStorage.score=0;

function startGame(){
 player=localStorage.getItem("playerName")||"Engineer";
 document.getElementById("start").style.display="none";

 [document.getElementById("correctSound"),document.getElementById("wrongSound"),document.getElementById("tickSound")].forEach(s=>{
   s.play().then(()=>{s.pause();s.currentTime=0;}).catch(()=>{});
 });

 bgm.play().catch(()=>{});

 updateScore();
 loadStage();
 startTimer();
 moveTrain();
}

document.getElementById("welcome").innerHTML="Welcome back, <b>"+(localStorage.getItem("playerName")||"Engineer")+"</b>!";

function loadStage(){
 let s=stages[current];
 document.getElementById("difficulty").innerHTML=`<span class="badge ${s.className}">${s.difficulty}</span>`;
 document.getElementById("questionTitle").textContent=s.title;
 document.getElementById("question").innerHTML=s.question;
 document.getElementById("answer").value="";
 document.getElementById("feedback").textContent="";
 document.getElementById("stageFill").style.width=((current+1)/3*100)+"%";
}

function checkAnswer(){
 let ans=parseFloat(document.getElementById("answer").value);
 let s=stages[current];
 if(Math.abs(ans-s.answer)<=s.tol){
   document.getElementById("correctSound").play();
   localStorage.score=parseInt(localStorage.score)+s.score;
   updateScore();
   if(current<2){
      document.getElementById("feedback").innerHTML="✅ Correct! Loading next stage...";
      current++;
      setTimeout(loadStage,1200);
   }else{
      clearInterval(timerInterval);
      document.getElementById("feedback").innerHTML=`<h2>🎉 Congratulations ${player}!</h2><p>You completed Level 2.</p><p>Preparing Level 3...</p>`;
      setTimeout(()=>window.location.href="level3.html",2500);
   }
 }else{
   document.getElementById("wrongSound").play();
   document.getElementById("feedback").textContent="❌ Incorrect. Try again.";
 }
}

function showHint(){alert(stages[current].hint);}
function updateScore(){document.getElementById("score").innerHTML="Score: "+localStorage.score;}

function startTimer(){
 const timerEl=document.getElementById("timer");
 timerEl.innerHTML=`⏳ Time Left: ${totalTime}s`;
 timerInterval=setInterval(()=>{
   timerEl.innerHTML=`⏳ Time Left: ${totalTime}s`;
   if(totalTime<=5&&totalTime>0) document.getElementById("tickSound").play().catch(()=>{});
   totalTime--;
   if(totalTime<0){
      clearInterval(timerInterval);
      document.getElementById("crashSound").play().catch(()=>{});
      alert("⏰ Time's up! The ART has failed the mission!");
      location.reload();
   }
 },1000);
}

function moveTrain(){
 let train=document.getElementById("train");
 let pos=-320;
 function animate(){
   pos+=3;
   train.style.left=pos+"px";
   if(pos<window.innerWidth) requestAnimationFrame(animate);
 }
 animate();
}
</script>
</body>
</html>
