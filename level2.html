<!DOCTYPE html><html><head><meta charset='UTF-8'>
<title>Level 2 - Dynamics</title>
<link rel='stylesheet' href='style.css'>
<style>:root{--bg:url('wallpaper2.jpg')}#train{width:240px}</style></head>
<body>
<div class='container'>
<h1>Level 2 - Dynamics</h1>
<div>Overall Progress<div class='bar'><div class='fill' style='width:50%'></div></div></div>
<p id='score'></p><div id='diff'></div><div id='q'></div>
<input id='ans'><br><button onclick='check()'>Submit</button>
<button onclick='hint()'>Hint</button><p id='fb'></p>
<img id='train' src='train.png'>
</div>
<script>
const stages=[\n{diff:"Easy",cls:"easy",title:"Stage 1",q:"Emergency braking. Calculate braking force (kN).",a:51.3,t:0.5,h:"F=ma",score:10},\n{diff:"Moderate",cls:"moderate",title:"Stage 2",q:"Driving force 50 kN, resistance 8 kN. Calculate acceleration.",a:0.636,t:0.005,h:"Fnet=Fdrive-Fresistance",score:20},\n{diff:"Challenge",cls:"challenge",title:"Stage 3",q:"70 kN drive, 6.5 kN drag, 4.0 kN rolling. Calculate acceleration.",a:0.902,t:0.005,h:"Fnet=Fdrive-Fdrag-Frolling",score:30}\n];
let i=0;
if(!localStorage.score) localStorage.score=0;
function load(){
let s=stages[i];
document.getElementById('score').textContent='Score: '+localStorage.score;
document.getElementById('diff').innerHTML='<span class="badge '+s.cls+'">'+s.diff+'</span>';
document.getElementById('q').innerHTML='<h3>'+s.title+'</h3><p>'+s.q+'</p>';
document.getElementById('ans').value='';document.getElementById('fb').textContent='';
}
function check(){
let s=stages[i],v=parseFloat(document.getElementById('ans').value);
if(Math.abs(v-s.a)<=s.t){
localStorage.score=parseInt(localStorage.score)+s.score;
if(i<2){i++;load();}
else{alert('Level Complete!');location.href='level3.html';}
}else{document.getElementById('fb').textContent='Incorrect. Try again.';}
}
function hint(){alert(stages[i].h);}
load();
</script></body></html>
