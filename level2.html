<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Escape Room - Level 2</title>
<style>
body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),url('wallpaper2.jpg') center/cover no-repeat;z-index:-1}
body{margin:0;font-family:Arial,sans-serif;color:#fff;display:flex;justify-content:center;padding:30px}
.container{width:min(900px,92%);background:rgba(255,255,255,.12);backdrop-filter:blur(10px);padding:25px;border-radius:18px;position:relative}
#score{position:absolute;top:18px;right:20px;font-weight:bold;color:gold}
.bar{height:12px;background:#334155;border-radius:10px;overflow:hidden}
.fill{height:100%;background:#22c55e;width:50%}
#stageBar .fill{width:33%}
.badge{display:inline-block;padding:6px 12px;border-radius:20px;font-weight:bold}
.easy{background:#16a34a}.moderate{background:#eab308;color:#000}.challenge{background:#dc2626}
input{width:60%;padding:10px;border-radius:8px;border:none;font-size:16px}
button{padding:10px 20px;border:none;border-radius:8px;margin:8px;cursor:pointer;background:#22c55e;font-weight:bold}
button:hover{background:#16a34a}
#timer{font-size:20px;color:#facc15;margin:10px 0}
#train{position:absolute;bottom:-40px;left:-320px;width:260px}
#start{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10}
</style>
</head>
<body>

<div id="start">
<h1>⚙️ Level 2 - Dynamics</h1>
<p id="welcome"></p>
<button onclick="startMission()">Start Mission</button>
</div>

<div class="container">
<div id="score">Score: 0</div>

<h2>Level 2 of 4</h2>
<div class="bar"><div class="fill"></div></div>

<h3 id="difficulty"></h3>
<div class="bar" id="stageBar"><div class="fill" id="stageFill"></div></div>

<div id="timer"></div>
<h2 id="questionTitle"></h2>
<p id="question"></p>

<input id="answer" placeholder="Enter your answer"><br>
<button onclick="checkAnswer()">Submit</button>
<button onclick="showHint()">💡 Hint</button>
<p id="feedback"></p>

<img id="train" src="train.png">

<audio id="correctSound" src="correct.mp3"></audio>
<audio id="wrongSound" src="wrong.mp3"></audio>
<audio id="tickSound" src="tick.mp3"></audio>
<audio id="bgm" src="bgm.mp3" loop></audio>
<audio id="crashSound" src="crash.mp3"></audio>
</div>

<script>
const player=localStorage.getItem("playerName")||"Engineer";
document.getElementById("welcome").innerHTML="Welcome back, <b>"+player+"</b>!";

const stages=[
{difficulty:"Easy",className:"easy",title:"Stage 1",
question:`A fully loaded KUTS ART travels at <b>70 km/h</b> before emergency braking and stops in <b>25 s</b>.<br><br>
Given:<br>• Empty mass = 42,000 kg<br>• 300 passengers<br>• 80 kg each<br><br>Calculate the average braking force (kN).`,
answer:51.3,tol:0.5,hint:"Find total mass, calculate acceleration, then F=ma.",score:10},
{difficulty:"Moderate",className:"moderate",title:"Stage 2",
question:`Mass = 66,000 kg<br>Driving force = 50 kN<br>Rolling resistance = 8 kN<br><br>Calculate the acceleration (m/s²).`,
answer:0.636,tol:0.005,hint:"Fnet=Fdrive−Fresistance",score:20},
{difficulty:"Challenge",className:"challenge",title:"Stage 3",
question:`Mass = 66,000 kg<br>Traction = 70 kN<br>Drag = 6.5 kN<br>Rolling resistance = 4.0 kN<br><br>Calculate the acceleration (m/s²).`,
answer:0.902,tol:0.005,hint:"Fnet=Fdrive−Fdrag−Frolling",score:30}
];
let current=0,totalTime=180,timerInterval;
if(!localStorage.score)localStorage.score=0;

function startMission(){
 document.getElementById("start").style.display="none";
 document.getElementById("bgm").play().catch(()=>{});
 updateScore(); loadStage(); startTimer(); moveTrain();
}
function loadStage(){
 let s=stages[current];
 difficulty.innerHTML=`<span class="badge ${s.className}">${s.difficulty}</span>`;
 questionTitle.textContent=s.title;
 question.innerHTML=s.question;
 answer.value=""; feedback.textContent="";
 stageFill.style.width=((current+1)/3*100)+"%";
}
function checkAnswer(){
 let v=parseFloat(answer.value),s=stages[current];
 if(Math.abs(v-s.answer)<=s.tol){
  correctSound.play();
  localStorage.score=parseInt(localStorage.score)+s.score;
  updateScore();
  if(current<2){feedback.innerHTML="✅ Correct! Loading next stage...";current++;setTimeout(loadStage,1200);}
  else{
   clearInterval(timerInterval);
   feedback.innerHTML=`<h2>🎉 Excellent ${player}!</h2><p>Preparing Level 3...</p>`;
   setTimeout(()=>location.href="level3.html",2500);
  }
 }else{
  wrongSound.play();
  feedback.textContent="❌ Incorrect. Try again!";
 }
}
function showHint(){alert(stages[current].hint);}
function updateScore(){score.textContent="Score: "+localStorage.score;}
function startTimer(){
 const timerEl=document.getElementById("timer");
 timerEl.textContent="⏳ Time Left: "+totalTime+" s";
 timerInterval=setInterval(()=>{
   totalTime--;
   timerEl.textContent="⏳ Time Left: "+totalTime+" s";
   if(totalTime<=5&&totalTime>0)tickSound.play().catch(()=>{});
   if(totalTime<=0){
      clearInterval(timerInterval);
      crashSound.play().catch(()=>{});
      alert("⏰ Time's up! The ART failed the braking test.");
      location.reload();
   }
 },1000);
}
function moveTrain(){
 let t=document.getElementById("train"),p=-320;
 (function anim(){p+=3;t.style.left=p+"px";if(p<window.innerWidth)requestAnimationFrame(anim);})();
}
</script>
</body>
</html>
