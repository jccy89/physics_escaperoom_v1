<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Physics Escape Room - Level 3 (Work, Energy and Power)</title><style>
body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),url('wallpaper3.jpg') center/cover no-repeat;z-index:-1}
body{margin:0;font-family:Arial,sans-serif;color:#fff;display:flex;justify-content:center;padding:30px}
.container{width:min(900px,92%);background:rgba(255,255,255,.12);backdrop-filter:blur(10px);padding:25px;border-radius:18px;position:relative}
#score{position:absolute;top:18px;right:20px;font-weight:bold;color:gold}.bar{height:12px;background:#334155;border-radius:10px;overflow:hidden}.fill{height:100%;background:#22c55e;width:75%}#stageBar .fill{width:33%}.badge{display:inline-block;padding:6px 12px;border-radius:20px;font-weight:bold}.easy{background:#16a34a}.moderate{background:#eab308;color:#000}.challenge{background:#dc2626}input{width:60%;padding:10px;border-radius:8px;border:none;font-size:16px}button{padding:10px 20px;border:none;border-radius:8px;margin:8px;cursor:pointer;background:#22c55e;font-weight:bold}button:hover{background:#16a34a}#timer{font-size:20px;color:#facc15;margin:10px 0}#train{position:absolute;bottom:-300px;left:-320px;width:500px}#start{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10}
</style></head><body>
<div id="start"><h1>⚡ Physics Escape Room</h1><p id="welcome"></p><button onclick="startGame()">Start Mission</button></div>
<div class="container"><div id="score">Score:0</div><h2>Level 3 of 4 (Work, Energy and Power)</h2><div class="bar"><div class="fill"></div></div><h3 id="difficulty"></h3><div class="bar" id="stageBar"><div class="fill" id="stageFill"></div></div><div id="timer"></div><h2 id="questionTitle"></h2><p id="question"></p><input id="answer"><br><button onclick="checkAnswer()">Submit</button><button onclick="showHint()">💡 Hint</button><p id="feedback"></p><img id="train" src="train.png"><audio id="correctSound" src="correct.mp3"></audio><audio id="wrongSound" src="wrong.mp3"></audio><audio id="tickSound" src="tick.mp3"></audio><audio id="bgm" src="bgm.mp3" loop></audio><audio id="crashSound" src="crash.mp3"></audio></div>
<script>
const stages=[
{difficulty:"Easy",className:"easy",title:"Stage 1",question:`The ART vehicle has a mass of <b>42,000 kg</b> and accelerates from rest to <b>15 m/s</b> before climbing <b>12 m</b>.<br><br>Assume g=9.81 m/s² and no energy losses.<br><br>Calculate the total energy supplied (KE+GPE).<br><b>Answer in MJ.</b>`,answer:9.67,tol:0.05,hint:"KE=½mv² and GPE=mgh",score:10},
{difficulty:"Moderate",className:"moderate",title:"Stage 2",question:`Traction force=21,000 N<br>Speed=15 m/s<br>Efficiency=85%<br><br>Calculate electrical power supplied (kW).`,answer:371,tol:2,hint:"P=Fv then efficiency=Pout/Pin",score:20},
{difficulty:"Challenge",className:"challenge",title:"Stage 3",question:`Stored energy=2.5×10⁸ J<br>KE=4.5×10⁶ J<br>Rolling work=2.5×10⁷ J<br>Losses=15%<br><br>Maximum complete journeys?`,answer:7,tol:0.1,hint:"Total energy per journey",score:30}
];
let current=0,totalTime=180,timerInterval;let bgm=document.getElementById("bgm");if(!localStorage.score)localStorage.score=0;
welcome.innerHTML="Welcome back, <b>"+(localStorage.getItem("playerName")||"Engineer")+"</b>!";
function startGame(){start.style.display="none";[correctSound,wrongSound,tickSound].forEach(s=>{s.play().then(()=>{s.pause();s.currentTime=0;}).catch(()=>{});});bgm.play().catch(()=>{});updateScore();loadStage();startTimer();moveTrain();}
function loadStage(){let s=stages[current];difficulty.innerHTML=`<span class="badge ${s.className}">${s.difficulty}</span>`;questionTitle.textContent=s.title;question.innerHTML=s.question;answer.value="";feedback.textContent="";stageFill.style.width=((current+1)/3*100)+"%";}
function checkAnswer(){let s=stages[current],a=parseFloat(answer.value);if(Math.abs(a-s.answer)<=s.tol){correctSound.play();localStorage.score=parseInt(localStorage.score)+s.score;updateScore();if(current<2){feedback.innerHTML="✅ Correct! Loading next stage...";current++;setTimeout(loadStage,1200);}else{clearInterval(timerInterval);feedback.innerHTML="<h2>🎉 Congratulations!</h2><p>You completed Level 3.</p><p>Preparing Level 4...</p>";setTimeout(()=>location.href="level4.html",2500);}}else{wrongSound.play();feedback.textContent="❌ Incorrect. Try again.";}}
function showHint(){alert(stages[current].hint);}
function updateScore(){score.innerHTML="Score: "+localStorage.score;}
function startTimer(){const el=document.getElementById("timer");el.innerHTML=`⏳ Time Left: ${totalTime}s`;timerInterval=setInterval(()=>{el.innerHTML=`⏳ Time Left: ${totalTime}s`;if(totalTime<=5&&totalTime>0)tickSound.play().catch(()=>{});totalTime--;if(totalTime<0){clearInterval(timerInterval);crashSound.play().catch(()=>{});alert("⏰ Time's up!");location.reload();}},1000);}
function moveTrain(){let p=-320;(function a(){p+=3;train.style.left=p+"px";if(p<window.innerWidth)requestAnimationFrame(a);})();}
</script></body></html>
