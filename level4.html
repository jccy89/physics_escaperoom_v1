<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Escape Room - Level 4 (Momentum/Impulse)</title>
<style>
body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),url('wallpaper4.jpg') center/cover no-repeat;z-index:-1}
body{margin:0;font-family:Arial,sans-serif;color:#fff;display:flex;justify-content:center;padding:30px}
.container{width:min(900px,92%);background:rgba(255,255,255,.12);backdrop-filter:blur(10px);padding:25px;border-radius:18px;position:relative}
#score{position:absolute;top:18px;right:20px;font-weight:bold;color:gold}
.bar{height:12px;background:#334155;border-radius:10px;overflow:hidden}
.fill{height:100%;background:#22c55e;width:100%}
#stageBar .fill{width:33%}
.badge{display:inline-block;padding:6px 12px;border-radius:20px;font-weight:bold}
.easy{background:#16a34a}.moderate{background:#eab308;color:#000}.challenge{background:#dc2626}
input{width:60%;padding:10px;border-radius:8px;border:none;font-size:16px}
button{padding:10px 20px;border:none;border-radius:8px;margin:8px;cursor:pointer;background:#22c55e;font-weight:bold}
button:hover{background:#16a34a}
#timer{font-size:20px;color:#facc15;margin:10px 0}
#train{position:absolute;bottom:-450px;left:-320px;width:500px;height:auto;}
#start{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10}
</style>
</head>
<body>
<div id="start">
<h1>🚨 Physics Escape Room</h1>
<p id="welcome"></p>
<button onclick="startGame()">Start Mission</button>
</div>

<div class="container">
<div id="score">Score: 0</div>
<h2>Level 4 of 4 (Momentum/Impulse)</h2>
<div class="bar"><div class="fill"></div></div>

<h3 id="difficulty"></h3>
<div class="bar" id="stageBar"><div class="fill" id="stageFill"></div></div>

<div id="timer"></div>

<h2 id="questionTitle"></h2>
<p id="question"></p>

<input id="answer" placeholder="Enter your answer"><br>
<button onclick="checkAnswer()">Submit</button>
<button onclick="showHint()">💡 Hint</button>

<p id="feedback"></p>

<img id="train" src="train.png" alt="train">

<audio id="correctSound" src="correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="wrong.mp3" preload="auto"></audio>
<audio id="tickSound" src="tick.mp3" preload="auto"></audio>
<audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
<audio id="crashSound" src="crash.mp3" preload="auto"></audio>
</div>

<script>
const stages=[
{
difficulty:"Easy",className:"easy",title:"Stage 1",
question:`During emergency braking, the ART momentum decreases from <b>1.32 × 10⁶ kg·m/s</b> to zero in <b>25 s</b>.<br><br>Calculate the average braking force.<br><b>Answer in kN (3 s.f.).</b>`,
answer:52.8,tol:0.5,hint:"Use F = Δp / t.",score:10
},
{
difficulty:"Moderate",className:"moderate",title:"Stage 2",
question:`A fully loaded ART has a mass of <b>66,000 kg</b> and must stop from <b>20 m/s</b>.<br><br>Maximum braking force = <b>45 kN</b>.<br><br>Determine the minimum stopping time (s) and provide answer in 3 significant figures.`,
answer:29.3,tol:0.2,hint:"Use F = m(v-u)/t.",score:20
},
{
difficulty:"Challenge",className:"challenge",title:"Stage 3",
question:`A fully loaded ART (66,000 kg) is travelling at <b>70 km/h</b>.<br><br>Maximum braking force = <b>55 kN</b>.<br><br>Determine the braking distance (m), assuming constant deceleration Give your answer in 3 significant figures.`,
answer:227,tol:2,hint:"Find stopping time using Ft=m(v-u), then use s=((u+v)/2)t.",score:30
}
];

let current=0,totalTime=180,timerInterval;
const bgm=document.getElementById("bgm");
if(!localStorage.score) localStorage.score=0;
document.getElementById("welcome").innerHTML="Welcome back, <b>"+(localStorage.getItem("playerName")||"Engineer")+"</b>!";

function startGame(){
document.getElementById("start").style.display="none";
[correctSound,wrongSound,tickSound].forEach(s=>{s.play().then(()=>{s.pause();s.currentTime=0;}).catch(()=>{});});
bgm.play().catch(()=>{});
updateScore();loadStage();startTimer();moveTrain();
}
function loadStage(){
const s=stages[current];
difficulty.innerHTML=`<span class="badge ${s.className}">${s.difficulty}</span>`;
questionTitle.textContent=s.title;
question.innerHTML=s.question;
answer.value="";
feedback.textContent="";
stageFill.style.width=((current+1)/3*100)+"%";
}
function checkAnswer(){
const s=stages[current];
const a=parseFloat(answer.value);
if(Math.abs(a-s.answer)<=s.tol){
correctSound.play();
localStorage.score=parseInt(localStorage.score)+s.score;
updateScore();
if(current<2){
feedback.innerHTML="✅ Correct! Loading next stage...";
current++;
setTimeout(loadStage,1200);
}else{
clearInterval(timerInterval);
feedback.innerHTML = `
<h2>🏆 Congratulations!</h2>
<p>You have completed the Physics Escape Room.</p>
<p><b>Final Score: ${localStorage.score}</b></p>
<p>🏁 All engineering missions completed successfully.</p>
<p>Preparing your final evaluation...</p>
`;

setTimeout(() => {
    window.location.href = "rating.html";
}, 3000);
}
}else{
wrongSound.play();
feedback.textContent="❌ Incorrect. Try again.";
}
}
function showHint(){alert(stages[current].hint);}
function updateScore(){score.innerHTML="Score: "+localStorage.score;}
function startTimer(){
const el=document.getElementById("timer");
el.innerHTML=`⏳ Time Left: ${totalTime}s`;
timerInterval=setInterval(()=>{
el.innerHTML=`⏳ Time Left: ${totalTime}s`;
if(totalTime<=5&&totalTime>0)tickSound.play().catch(()=>{});
totalTime--;
if(totalTime<0){
clearInterval(timerInterval);
crashSound.play().catch(()=>{});
alert("⏰ Time's up! The ART has failed the mission!");
location.reload();
}
},1000);
}
function moveTrain(){
let p=-320;
(function anim(){p+=3;train.style.left=p+"px";if(p<window.innerWidth)requestAnimationFrame(anim);})();
}
</script>
</body>
</html>
