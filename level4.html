<!DOCTYPE html><html><head><meta charset='UTF-8'>
<title>Level 4 - Momentum & Impulse</title>
<link rel='stylesheet' href='style.css'>
<style>:root{--bg:url('wallpaper2.jpg')}#train{width:240px}</style></head>
<body>
<div class='container'>
<h1>Level 4 - Momentum & Impulse</h1>
<div>Overall Progress<div class='bar'><div class='fill' style='width:100%'></div></div></div>
<p id='score'></p><div id='diff'></div><div id='q'></div>
<input id='ans'><br><button onclick='check()'>Submit</button>
<button onclick='hint()'>Hint</button><p id='fb'></p>
<img id='train' src='train.png'>
</div>
<script>
const stages=[\n{diff:"Easy",cls:"easy",title:"Stage 1",q:"Average braking force (kN).",a:52.8,t:0.5,h:"F=m(v-u)/t",score:10},\n{diff:"Moderate",cls:"moderate",title:"Stage 2",q:"Minimum stopping time (s).",a:29.3,t:0.2,h:"F=m(v-u)/t",score:20},\n{diff:"Challenge",cls:"challenge",title:"Stage 3",q:"Stopping distance (m).",a:226,t:1,h:"Ft=m(v-u); s=(u+v)t/2",score:30}\n];
let i=0;
if(!localStorage.score) localStorage.score=0;
function load(){
let s=stages[i];
document.getElementById('score').textContent='Score: '+localStorage.score;
document.getElementById('diff').innerHTML='<span class="badge '+s.cls+'">'+s.diff+'</span>';
document.getElementById('q').innerHTML='<h3>'+s.title+'</h3><p>'+s.q+'</p>';
document.getElementById('ans').value='';document.getElementById('fb').textContent='';
}
function check(){
let s=stages[i],v=parseFloat(document.getElementById('ans').value);
if(Math.abs(v-s.a)<=s.t){
localStorage.score=parseInt(localStorage.score)+s.score;
if(i<2){i++;load();}
else{alert('Level Complete!');location.href='certificate.html';}
}else{document.getElementById('fb').textContent='Incorrect. Try again.';}
}
function hint(){alert(stages[i].h);}
load();
</script></body></html>
